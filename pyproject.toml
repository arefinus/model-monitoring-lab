[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-monitoring-lab"
version = "0.1.0"
description = "Drift, calibration and data-quality monitoring for prediction streams with a documented alert state machine and delayed-label handling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Sultanul Arefin Sourav"}]
keywords = ["mlops", "monitoring", "drift-detection", "data-quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
model-monitoring-lab = "model_monitoring_lab.cli:main"

[project.urls]
Repository = "https://github.com/arefinus/model-monitoring-lab"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_monitoring_lab = ["../../schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
